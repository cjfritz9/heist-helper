<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: #1b1712; overflow: hidden; user-select: none; }
  button {
    width: 100%; height: 100%; border: 1px solid #8a6d3b; background: #2a231a; color: #e8c872;
    font: bold 18px/1 "Segoe UI", sans-serif; cursor: pointer;
  }
  button:hover { background: #3a2f22; }
</style>
</head>
<body>
<button id="open" title="Open Heist Helper (drag to move)">H</button>
<script>
  const send = (message) => fetch("https://bolt-api/send-message", { method: "POST", body: message });
  const DRAG_PIXELS = 4;
  let pressed = null;

  const button = document.getElementById("open");
  button.addEventListener("mousedown", (event) => {
    pressed = { x: event.screenX, y: event.screenY };
  });
  button.addEventListener("mousemove", (event) => {
    if (!pressed) return;
    const moved = Math.abs(event.screenX - pressed.x) + Math.abs(event.screenY - pressed.y);
    if (moved >= DRAG_PIXELS) {
      pressed = null;
      fetch("https://bolt-api/start-reposition?h=0&v=0");
    }
  });
  button.addEventListener("mouseup", () => {
    if (pressed) send("expand");
    pressed = null;
  });
</script>
</body>
</html>
